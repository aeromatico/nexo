version: '3.8'

services:
  mariadb:
    image: mariadb:10.6
    container_name: nexo-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-nexo}
      MYSQL_USER: ${DB_USER:-frappe}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexo-network

  redis-cache:
    image: redis:7-alpine
    container_name: nexo-redis-cache
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-cache-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexo-network

  redis-queue:
    image: redis:7-alpine
    container_name: nexo-redis-queue
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-queue-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexo-network

  redis-socketio:
    image: redis:7-alpine
    container_name: nexo-redis-socketio
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis-socketio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexo-network

  erpnext:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.production
    image: nexo-erpnext:latest
    container_name: nexo-erpnext
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME:-nexo}
      DB_USER: ${DB_USER:-frappe}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CACHE: redis-cache:6379/1
      REDIS_QUEUE: redis-queue:6379/1
      REDIS_SOCKETIO: redis-socketio:6379/1
      SOCKETIO_PORT: 9000
      FRAPPE_PORT: 8000
      SITE_NAME: ${SITE_NAME:-nexo.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - nexo-network

  erpnext-worker:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.production
    image: nexo-erpnext:latest
    container_name: nexo-erpnext-worker
    command: bench worker
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME:-nexo}
      DB_USER: ${DB_USER:-frappe}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CACHE: redis-cache:6379/1
      REDIS_QUEUE: redis-queue:6379/1
      REDIS_SOCKETIO: redis-socketio:6379/1
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - erpnext
      - mariadb
      - redis-queue
    restart: unless-stopped
    networks:
      - nexo-network

  erpnext-scheduler:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.production
    image: nexo-erpnext:latest
    container_name: nexo-erpnext-scheduler
    command: bench scheduler
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME:-nexo}
      DB_USER: ${DB_USER:-frappe}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_CACHE: redis-cache:6379/1
      REDIS_QUEUE: redis-queue:6379/1
      REDIS_SOCKETIO: redis-socketio:6379/1
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      - erpnext
      - mariadb
      - redis-queue
    restart: unless-stopped
    networks:
      - nexo-network

  nginx:
    image: nginx:alpine
    container_name: nexo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - sites:/home/frappe/frappe-bench/sites:ro
      - ./ssl:/etc/nginx/ssl:ro
      - logs:/var/log/nginx
    depends_on:
      - erpnext
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexo-network

  prometheus:
    image: prom/prometheus:latest
    container_name: nexo-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - nexo-network

  grafana:
    image: grafana/grafana:latest
    container_name: nexo-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - nexo-network

volumes:
  mariadb-data:
    driver: local
  redis-cache-data:
    driver: local
  redis-queue-data:
    driver: local
  redis-socketio-data:
    driver: local
  sites:
    driver: local
  logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  nexo-network:
    driver: bridge
